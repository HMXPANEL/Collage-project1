name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install sqlite dev libraries (required by sqflite_common_ffi tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        run: flutter create --project-name eco_action --platforms=android --org dev.ecoaction .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate canonical formatting patch
        run: dart format lib test
      - name: Export and upload formatting patch
        run: |
          git diff -- lib test > /tmp/format.patch || true
          if [ -s /tmp/format.patch ]; then echo "patch present"; else echo "no diff"; fi
      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: /tmp/format.patch

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecoaction-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error