name: eco_action
description: "EcoAction - a local-first, offline-friendly personal climate action app for Android."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  sqflite: ^2.4.3
  intl: ^0.20.3
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^19.2.0
  flutter_timezone: ^5.1.0
  timezone: ^0.10.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  sqlite3: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/onboarding welcome.png
    - assets/onboarding all set.png